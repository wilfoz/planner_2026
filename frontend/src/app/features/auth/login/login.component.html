<div class="min-h-screen flex items-center justify-center bg-[#18181b] px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-sm space-y-8 text-center">

    <div class="flex flex-col items-center gap-4 mb-8">
      <div class="p-4 bg-[#27272a] rounded-full ring-1 ring-[#3f3f46]">
        <lucide-icon [img]="HardHatIcon" class="h-12 w-12 text-white"></lucide-icon>
      </div>
      <h2 class="text-3xl font-bold tracking-tight text-white">
        LT-PLANNER
      </h2>
      <p class="text-gray-400">
        Sign in to access your workspace
      </p>
    </div>

    <div>
      <button (click)="login()"
        class="flex w-full items-center justify-center gap-2 rounded-md bg-indigo-600 px-3 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all duration-200">
        <lucide-icon [img]="LogInIcon" class="h-5 w-5"></lucide-icon>
        Sign in with SSO
      </button>
    </div>

  </div>
</div>
